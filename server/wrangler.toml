# NumDraw 활성화 서버 — Cloudflare Workers 설정
# 시크릿(개인키, 관리자 토큰)은 여기 넣지 않는다. `wrangler secret put`으로만 등록한다.

name = "numdraw-activation"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"                          # env.DB 로 접근
database_name = "numdraw-license"
# 아래 database_id는 실제 값으로 교체해야 한다 (server/README.md 참조).
# 로컬 개발(`npm run dev`)은 이 값이 자리표시자여도 동작한다.
database_id = "00000000-0000-0000-0000-000000000000"
